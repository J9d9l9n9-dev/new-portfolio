<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#07070c"/>
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="url(#grad)" stroke-width="2" stroke-opacity="0.4"/>
  <polygon points="32,12 50,22 50,42 32,52 14,42 14,22" stroke="url(#grad)" stroke-width="3" fill="none" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="5" fill="url(#grad)"/>
</svg>